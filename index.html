<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EEG Web Annotator</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f4f4f2;--line:#d8d8d4;--acc:#2a6df4}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#9a9a9a;--card:#222;--line:#3a3a3a;--acc:#6b9bff}}
*{box-sizing:border-box}
body{margin:0 auto;padding:12px;max-width:1100px;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:18px;margin:0 0 4px}
p.sub{margin:0 0 8px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
button,select,.btn{font:inherit;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
.lab{border-left-width:6px}
canvas{display:block;width:100%;height:58vh;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:6px;touch-action:none}
#st{color:var(--mut);margin:6px 0}
#ov{height:44px;min-height:0;margin-top:6px;cursor:pointer}
input[type=number]{font:inherit;padding:6px;width:84px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px}
#ls{list-style:none;padding:0;margin:0;max-height:200px;overflow:auto}
#ls li{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
#ls span{flex:1}
input[type=file]{display:none}
</style>
</head>
<body>
<h1>EEG Web Annotator</h1>
<p class="sub">Drag on the traces to select a segment, then tap a label (or press 1-7). Arrow keys page through the recording.</p>

<div class="bar">
  <button id="demo">Demo</button>
  <label class="btn">Load EEG (.edf / .json)<input type="file" id="fj" accept=".edf,.json"></label>
  <label class="btn">Import labels (.csv)<input type="file" id="fc" accept=".csv"></label>
  <button id="ex">Export CSV</button>
</div>

<div class="bar" id="lb"></div>

<div class="bar">
  <button id="prev">&larr;</button>
  <button id="next">&rarr;</button>
  <select id="win"><option>5</option><option selected>10</option><option>20</option><option>30</option></select> s
  <button id="gu">Gain +</button>
  <button id="gd">Gain &minus;</button>
  <select id="nch"><option>8</option><option selected>16</option><option>32</option><option value="999">All</option></select> ch
  <button id="cu">Ch &uarr;</button>
  <button id="cd">Ch &darr;</button>
  <label><input type="checkbox" id="flt" checked> 1-40 Hz view</label>
  <input type="number" id="go" min="0" placeholder="Go to s"><button id="gob">Go</button>
</div>

<canvas id="cv"></canvas>
<canvas id="ov" title="Overview: tap to jump"></canvas>
<div id="st"></div>
<ul id="ls"></ul>

<script>
const LABELS=[['eyem','#e5484d'],['musc','#f5a524'],['elec','#a855f7'],['chew','#0ea5e9'],['shiv','#10b981'],['bckg','#8b8b8b'],['seiz','#d6336c']];
const S={sf:128,ch:[],raw:[],d:[],t0:0,win:10,gain:200,labels:[],sel:null,c0:0,show:16,note:''};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),LM=44;
const $=id=>document.getElementById(id);
const PAL=['#8b8b8b','#2a9d8f','#e9c46a','#f4a261','#264653','#b5179e'];
const col=n=>(LABELS.find(l=>l[0]===n)||[0,PAL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length]])[1];
const total=()=>S.d.length?S.d[0].length/S.sf:0;

function load(j){
  S.sf=j.sfreq;S.ch=j.ch_names;S.raw=j.data.map(a=>Float32Array.from(a));
  S.note=j.note||'';S.c0=0;S.t0=0;S.sel=null;
  S.labels=(j.events||[]).slice().sort((a,b)=>a.on-b.on);
  apply();draw();list();
}
function apply(){S.d=$('flt').checked?S.raw.map(a=>filt(a,S.sf)):S.raw;}

/*EDF-START*/
function filt(a,sf){
  const n=a.length,o=new Float32Array(n),k=2*Math.PI/sf,hp=1/(1+k),lp=k*40/(1+k*40);
  let y=0,px=a[0],l1=0,l2=0;
  for(let i=0;i<n;i++){y=hp*(y+a[i]-px);px=a[i];l1+=lp*(y-l1);l2+=lp*(l1-l2);o[i]=l2;}
  return o;
}
function parseEdf(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),lat=new TextDecoder('latin1');
  const txt=(o,l)=>lat.decode(u8.subarray(o,o+l)).trim();
  const hb=+txt(184,8),rd=+txt(244,8),ns=+txt(252,4);let nr=+txt(236,8);
  if(!(ns>0)||!(rd>0)||!(hb>0))throw new Error('not a valid EDF file');
  const g=(s,l,i)=>txt(256+s*ns+i*l,l),sig=[];let tot=0;
  for(let i=0;i<ns;i++){
    const s={lab:g(0,16,i),dim:g(96,8,i).toLowerCase(),pmin:+g(104,8,i),pmax:+g(112,8,i),dmin:+g(120,8,i),dmax:+g(128,8,i),n:+g(216,8,i),off:tot};
    s.gain=s.dmax!==s.dmin?(s.pmax-s.pmin)/(s.dmax-s.dmin):1;
    s.mul=s.dim==='mv'?1e3:s.dim==='v'?1e6:1;
    tot+=s.n;sig.push(s);
  }
  const rb=tot*2,avail=Math.floor((buf.byteLength-hb)/rb);
  if(!(nr>=0)||nr>avail)nr=avail;
  const rec=Math.min(nr,Math.ceil(600/rd));
  const isAnn=s=>/annotations/i.test(s.lab);
  const eeg=sig.filter(s=>!isAnn(s)&&s.n>0);
  if(!eeg.length||rec<1)throw new Error('no EEG signal found');
  const ref=eeg[0].n,use=eeg.filter(s=>s.n===ref),ann=sig.filter(isAnn);
  const step=Math.max(1,Math.ceil(ref/rd/256)),per=Math.ceil(ref/step);
  const data=use.map(()=>new Float32Array(rec*per)),events=[],dec=new TextDecoder('utf-8');
  for(let r=0;r<rec;r++){
    const base=hb+r*rb;
    use.forEach((s,k)=>{
      const o=base+s.off*2;
      for(let i=0,j=0;i<s.n;i+=step,j++)data[k][r*per+j]=((dv.getInt16(o+i*2,true)-s.dmin)*s.gain+s.pmin)*s.mul;
    });
    ann.forEach(s=>{
      const o=base+s.off*2;
      dec.decode(u8.subarray(o,o+s.n*2)).split('\x00').forEach(t=>{
        const m=t.match(/^([+-]\d+(?:\.\d+)?)(?:\x15(\d+(?:\.\d+)?))?\x14([\s\S]*)$/);
        if(!m)return;
        m[3].split('\x14').filter(x=>x.trim()).forEach(x=>events.push({on:+(+m[1]).toFixed(3),du:+(+(m[2]||0)).toFixed(3),d:x.trim()}));
      });
    });
  }
  const notes=[];
  if(rec<nr)notes.push('first '+Math.round(rec*rd)+' s loaded');
  if(use.length<eeg.length)notes.push('channels with a different sampling rate skipped');
  if(events.length)notes.push(events.length+' events from file');
  return{sfreq:per/rd,ch_names:use.map(s=>s.lab.replace(/^EEG\s+/i,'').replace(/[.\s]+$/,'').replace(/-(REF|LE|AV)$/i,'')),data,events,note:notes.join(', ')};
}
/*EDF-END*/

function demo(){
  const sf=128,n=sf*120,ch=['Fp1','Fp2','F3','F4','C3','C4','O1','O2'];
  const d=ch.map((c,i)=>{const a=new Float32Array(n);
    for(let k=0;k<n;k++)a[k]=(Math.random()-.5)*20+(c[0]==='O'?25:8)*Math.sin(2*Math.PI*10*k/sf+i);
    return a;});
  const ev=[];
  [6,17,29,44,70,108].forEach(t=>{
    [[0,1],[1,1],[2,.3],[3,.3]].forEach(([c,g])=>{for(let k=-30;k<=30;k++)d[c][Math.round(t*sf)+k]+=150*g*Math.exp(-k*k/200);});
    ev.push({on:t-0.3,du:0.6,d:'eyem'});
  });
  for(let c=2;c<6;c++)for(let k=35*sf;k<37*sf;k++)d[c][k]+=(Math.random()-.5)*120;
  ev.push({on:35,du:2,d:'musc'});
  for(let k=0;k<sf*3;k++)for(let c=0;c<8;c++)d[c][48*sf+k]+=150*Math.sin(2*Math.PI*1.5*k/sf);
  ev.push({on:48,du:3,d:'elec'});
  for(let k=0;k<sf*2;k++)d[4][58*sf+k]+=250*Math.exp(-k/(sf*.3));
  ev.push({on:58,du:1,d:'elec'});
  for(let k=0;k<sf*20;k++){
    const t=k/sf,env=Math.min(1,t/3,(20-t)/3),ph=2*Math.PI*(4*t-0.0375*t*t);
    for(let c=0;c<8;c++)d[c][75*sf+k]+=env*(90*Math.sin(ph+c*0.15)+30*Math.sin(2*ph+0.5));
  }
  ev.push({on:75,du:20,d:'seiz'});
  ev.sort((a,b)=>a.on-b.on);
  load({sfreq:sf,ch_names:ch,data:d,events:ev,note:'synthetic demo, not real EEG'});
}

function draw(){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,fg=getComputedStyle(document.body).color;
  ctx.clearRect(0,0,W,H);ctx.font='11px system-ui';
  if(!S.d.length){ctx.fillStyle=fg;ctx.fillText('Tap Demo or load a JSON file',12,24);return;}
  const vis=S.d.slice(S.c0,S.c0+S.show),nm=S.ch.slice(S.c0,S.c0+S.show),pw=W-LM,n=vis.length,rh=H/n,tx=t=>LM+(t-S.t0)/S.win*pw;
  ctx.lineWidth=1;ctx.strokeStyle='rgba(128,128,128,.25)';ctx.fillStyle=fg;
  for(let t=Math.ceil(S.t0);t<S.t0+S.win;t++){const x=tx(t);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillText(t+'s',x+2,H-3);}
  S.labels.forEach(l=>{
    if(l.on+l.du<S.t0||l.on>S.t0+S.win)return;
    ctx.fillStyle=col(l.d)+'55';ctx.fillRect(tx(l.on),0,Math.max(2,l.du/S.win*pw),H);
    ctx.fillStyle=col(l.d);ctx.fillText(l.d,tx(l.on)+2,12);
  });
  if(S.sel){const a=Math.min(S.sel.a,S.sel.b),b=Math.max(S.sel.a,S.sel.b);
    ctx.fillStyle='rgba(42,109,244,.25)';ctx.fillRect(tx(a),0,(b-a)/S.win*pw,H);}
  const i0=Math.max(0,Math.floor(S.t0*S.sf)),i1=Math.min(S.d[0].length,Math.ceil((S.t0+S.win)*S.sf)),step=Math.max(1,Math.floor((i1-i0)/pw));
  vis.forEach((a,c)=>{
    const cy=rh*(c+.5);
    ctx.fillStyle=fg;ctx.fillText(nm[c],4,cy+4);
    ctx.strokeStyle=fg;ctx.beginPath();
    for(let i=i0;i<i1;i+=step){const x=LM+(i/S.sf-S.t0)/S.win*pw,y=cy-a[i]/S.gain*rh;i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
  });
  $('st').textContent=`${S.t0.toFixed(1)}-${(S.t0+S.win).toFixed(1)} s of ${total().toFixed(0)} s · ${S.sf.toFixed(0)} Hz · ch ${S.c0+1}-${S.c0+vis.length} of ${S.ch.length} · ${S.labels.length} labels · gain ${S.gain.toFixed(0)} µV/row${S.note?' · '+S.note:''}`;
  drawOv();
}

function tAt(e){const r=cv.getBoundingClientRect();return S.t0+Math.min(Math.max((e.clientX-r.left-LM)/(r.width-LM),0),1)*S.win;}
let drag=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag=tAt(e);S.sel={a:drag,b:drag};draw();};
cv.onpointermove=e=>{if(drag===null)return;S.sel={a:drag,b:tAt(e)};draw();};
cv.onpointerup=()=>{drag=null;if(S.sel&&Math.abs(S.sel.a-S.sel.b)<.05)S.sel=null;draw();};

function add(d){
  if(!S.sel)return;
  const a=Math.min(S.sel.a,S.sel.b),b=Math.max(S.sel.a,S.sel.b);
  S.labels.push({on:+a.toFixed(3),du:+(b-a).toFixed(3),d});
  S.labels.sort((x,y)=>x.on-y.on);S.sel=null;draw();list();
}

function list(){
  const ul=$('ls');ul.innerHTML='';
  S.labels.forEach((l,i)=>{
    const li=document.createElement('li'),s=document.createElement('span');
    s.textContent=`${l.on}s  +${l.du}s  ${l.d}`;s.style.color=col(l.d);
    const g=document.createElement('button');g.textContent='Go';g.onclick=()=>{S.t0=Math.max(0,l.on-1);draw();};
    const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{S.labels.splice(i,1);draw();list();};
    li.append(s,g,x);ul.append(li);
  });
}

function drawOv(){
  const c=$('ov'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,x=c.getContext('2d');
  c.width=r.width*dpr;c.height=r.height*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,r.width,r.height);
  const T=total();if(!T)return;
  S.labels.forEach(l=>{x.fillStyle=col(l.d);x.fillRect(l.on/T*r.width,0,Math.max(2,l.du/T*r.width),r.height);});
  x.strokeStyle=getComputedStyle(document.body).color;x.lineWidth=2;
  x.strokeRect(S.t0/T*r.width,1,Math.max(3,S.win/T*r.width),r.height-2);
}
function jump(t){S.t0=Math.min(Math.max(0,t-S.win/2),Math.max(0,total()-S.win));draw();}
function page(dir){S.t0=Math.min(Math.max(0,S.t0+dir*S.win*0.8),Math.max(0,total()-S.win));draw();}
function dl(s,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();}

LABELS.forEach(([n,c],i)=>{
  const b=document.createElement('button');b.className='lab';b.style.borderLeftColor=c;
  b.textContent=`${i+1} ${n}`;b.onclick=()=>add(n);$('lb').append(b);
});

$('demo').onclick=demo;
$('prev').onclick=()=>page(-1);
$('next').onclick=()=>page(1);
$('win').onchange=e=>{S.win=+e.target.value;draw();};
$('gu').onclick=()=>{S.gain=Math.max(25,S.gain/1.5);draw();};
$('gd').onclick=()=>{S.gain=S.gain*1.5;draw();};
$('ex').onclick=()=>dl('onset,duration,description\n'+S.labels.map(l=>`${l.on},${l.du},${l.d}`).join('\n')+'\n','annotations.csv','text/csv');
$('fj').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    if(/\.edf$/i.test(f.name))load(parseEdf(await f.arrayBuffer()));
    else load(JSON.parse(await f.text()));
  }catch(err){$('st').textContent='Could not read file: '+err.message;}
  e.target.value='';
};
$('nch').onchange=e=>{S.show=+e.target.value;S.c0=0;draw();};
$('cu').onclick=()=>{S.c0=Math.max(0,S.c0-S.show);draw();};
$('cd').onclick=()=>{if(S.c0+S.show<S.ch.length)S.c0+=S.show;draw();};
$('flt').onchange=()=>{apply();draw();};
$('fc').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    let first=null;
    t.split(/\r?\n/).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('onset')).forEach(l=>{
      const [on,du,...d]=l.split(',');
      if(isNaN(+on))return;
      S.labels.push({on:+on,du:+du,d:d.join(',').trim()});
      if(first===null||+on<first)first=+on;
    });
    S.labels.sort((a,b)=>a.on-b.on);
    if(first!==null)S.t0=Math.min(Math.max(0,first-2),Math.max(0,total()-S.win));
    draw();list();
  });
  e.target.value='';
};
$('ov').onpointerdown=e=>{const r=$('ov').getBoundingClientRect(),T=total();if(T)jump((e.clientX-r.left)/r.width*T);};
$('gob').onclick=()=>{const v=parseFloat($('go').value);if(!isNaN(v))jump(v);};
$('go').onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){const v=parseFloat($('go').value);if(!isNaN(v))jump(v);}};
document.onkeydown=e=>{
  if(e.key==='ArrowRight')page(1);
  else if(e.key==='ArrowLeft')page(-1);
  else if(e.key==='Escape'){S.sel=null;draw();}
  else if(/^[1-7]$/.test(e.key))add(LABELS[+e.key-1][0]);
};
window.onresize=draw;
draw();
</script>
</body>
</html>
